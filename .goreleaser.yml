# GoReleaser configuration for net-peek.
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: net-peek
    main: .
    binary: net-peek

    goos:
      - linux

    goarch:
      - amd64

    flags:
      - -trimpath

    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

    env:
      - CGO_ENABLED=1

archives:
  - id: net-peek
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch

release:
  github:
    owner: itcaat
    name: net-peek

  draft: false
  prerelease: auto

  name_template: "net-peek v{{.Version}}"

  header: |
    ## net-peek v{{.Version}}

    A TUI for watching per-remote-IP traffic usage on a network interface.

    ### Installation

    Download the Linux binary from the assets below, or install with Go:

    ```bash
    go install github.com/itcaat/net-peek@{{.Tag}}
    ```

  footer: |
    ### Usage

    ```bash
    sudo net-peek -i all
    sudo net-peek -i eth0
    ```

    For more information, see the [README](https://github.com/itcaat/net-peek/blob/main/README.md).
