name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: linux_amd64
            install: sudo apt-get update && sudo apt-get install -y libpcap-dev
          - runner: ubuntu-24.04-arm
            asset: linux_arm64
            install: sudo apt-get update && sudo apt-get install -y libpcap-dev
          - runner: macos-15-intel
            asset: darwin_amd64
            install: "true"
          - runner: macos-15
            asset: darwin_arm64
            install: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install native dependencies
        run: ${{ matrix.install }}

      - name: Run tests
        run: go test -v ./...

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist/package
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${date}" \
            -o dist/package/net-peek \
            .
          cp README.md dist/package/
          if compgen -G "LICENSE*" > /dev/null; then cp LICENSE* dist/package/; fi
          tar -czf "dist/net-peek_${GITHUB_REF_NAME}_${{ matrix.asset }}.tar.gz" -C dist/package .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: net-peek-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "net-peek ${GITHUB_REF_NAME}" \
            --generate-notes
